services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"         # PHP-Server hört auf 8000
    volumes:
      - ./backend:/var/www/html
    networks:
      - jetnet

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"           # nginx oder dist läuft auf Port 80 im Container
    networks:
      - jetnet
    depends_on:
      - backend

networks:
  jetnet:
    driver: bridge
